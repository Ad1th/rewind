[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rewind-backend"
version = "0.1.0"
description = "REWIND Backend Control Plane API & Session Manager"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "pydantic>=2.6.4",
    "websockets>=12.0",
]
