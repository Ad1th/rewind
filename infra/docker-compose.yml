version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rewind_postgres
    environment:
      POSTGRES_DB: rewind_db
      POSTGRES_USER: rewind_user
      POSTGRES_PASSWORD: rewind_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rewind_user -d rewind_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
